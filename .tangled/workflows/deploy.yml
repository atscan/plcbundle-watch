engine: nixery
when:
  - event: ["push", "pull_request"]
    branch: ["master"]

dependencies:
  nixpkgs:
    - nodejs

steps:
  - name: build site
    command: |
      nix develop --command bash -c 'vite build'
  - name: deploy
    command: |
      npx --yes wrangler pages deploy --branch main --project-name plcbundle-watch ./build/
