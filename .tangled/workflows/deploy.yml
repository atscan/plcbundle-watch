engine: nixery
when:
  - event: ["push", "pull_request"]
    branch: ["main"]

dependencies:
  nixpkgs:
    - nodejs

steps:
  - name: build site
    command: |
      curl -fsSL https://get.pnpm.io/install.sh | sh -
      pnpm install
      pnpm run build
  - name: deploy
    command: |
      npx --yes wrangler pages deploy --branch main --project-name plcbundle-watch ./dist/
