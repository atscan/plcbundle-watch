engine: nixery
when:
  - event: ["push", "pull_request"]
    branch: ["main"]

dependencies:
  nixpkgs:
    - bun
steps:
  - name: build site
    command: |
      bun i && bun run build

  - name: deployw
    command: |
      bunx wrangler pages deploy --branch main --project-name plcbundle-watch ./dist/
